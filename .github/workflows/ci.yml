name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_LEGACY_JSON_FALLBACK: "false"
      APP_SQLITE_PATH: ${{ runner.temp }}/meizhaiseek-ci.sqlite3
      APP_RUNTIME_DIR: ${{ runner.temp }}/meizhaiseek-runtime
      AUTH_TOKEN_SECRET: ci-test-secret
      MEIZHAISEEK_ADMIN_USERNAME: admin
      MEIZHAISEEK_ADMIN_INITIAL_PASSWORD: admin123456
      DEEPSEEK_API_KEY: ""
      BGE_MODEL_PATH: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API dependencies
        run: python -m pip install -r apps/api/requirements.txt

      - name: Install API test dependencies
        run: python -m pip install pytest

      - name: Compile API
        run: python -m compileall apps/api

      - name: Run API unit tests
        run: python -m unittest discover -s apps/api/tests

      - name: Run API pytest suite
        run: python -m pytest apps/api/tests

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build web
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: npm run build
