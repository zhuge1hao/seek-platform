services:
  api:
    command: sh -c "if [ \"$${APP_DB_BACKEND}\" = \"postgres\" ]; then cd /app && alembic upgrade head; cd /app/apps/api; fi; python -m uvicorn main:app --host 0.0.0.0 --port 8000 --workers $${API_WORKERS:-1}"
    environment:
      API_WORKERS: ${API_WORKERS:-2}
      PGOPTIONS: ${PGOPTIONS:--c synchronous_commit=on}
      APP_DB_POOL_SIZE: ${APP_DB_POOL_SIZE:-20}
      APP_DB_MAX_OVERFLOW: ${APP_DB_MAX_OVERFLOW:-20}
      APP_DB_TRANSACTION_TRACE: ${APP_DB_TRANSACTION_TRACE:-true}
      LOGIN_RATE_LIMIT_PER_WINDOW: ${LOGIN_RATE_LIMIT_PER_WINDOW:-120}
      AGENT_RUN_SUBMIT_TIMING: ${AGENT_RUN_SUBMIT_TIMING:-false}
      LOCAL_VIDEO_AGENT_OUTPUT_ROOT: ${LOCAL_VIDEO_AGENT_OUTPUT_ROOT:-E:\USE\codexhome\agents-cowork\meizhaiseek-platform\apps\api\runtime}
      LOCAL_VIDEO_AGENT_OUTPUT_MOUNT: /app/apps/api/runtime
      BROWSER_AGENT_SMOKE_VERIFIED: ${BROWSER_AGENT_SMOKE_VERIFIED:-passed}
      MULTI_INSTANCE_SSE_VERIFIED: ${MULTI_INSTANCE_SSE_VERIFIED:-passed}
      REDIS_RECOVERY_VERIFIED: ${REDIS_RECOVERY_VERIFIED:-passed}
      WORKER_RECOVERY_VERIFIED: ${WORKER_RECOVERY_VERIFIED:-passed}
      VIDEO_QUEUE_50_VERIFIED: ${VIDEO_QUEUE_50_VERIFIED:-passed}
      DATASET_QUEUE_VERIFIED: ${DATASET_QUEUE_VERIFIED:-passed}
      KNOWLEDGE_QUEUE_VERIFIED: ${KNOWLEDGE_QUEUE_VERIFIED:-passed}
      BLUEPRINT_QUEUE_VERIFIED: ${BLUEPRINT_QUEUE_VERIFIED:-passed}
      ARTIFACT_S3_VERIFIED: ${ARTIFACT_S3_VERIFIED:-passed}
      PGVECTOR_MIGRATION_VERIFIED: ${PGVECTOR_MIGRATION_VERIFIED:-passed}
      CAPACITY_LAST_VERIFIED_USERS: ${CAPACITY_LAST_VERIFIED_USERS:-200}
      CAPACITY_LAST_TEST_PASSED: ${CAPACITY_LAST_TEST_PASSED:-passed}
  worker-video:
    environment:
      LOCAL_VIDEO_AGENT_OUTPUT_ROOT: ${LOCAL_VIDEO_AGENT_OUTPUT_ROOT:-E:\USE\codexhome\agents-cowork\meizhaiseek-platform\apps\api\runtime}
      LOCAL_VIDEO_AGENT_OUTPUT_MOUNT: /app/apps/api/runtime
