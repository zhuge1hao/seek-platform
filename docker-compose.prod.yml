services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      APP_SQLITE_PATH: apps/api/runtime/app/meizhaiseek.sqlite3
      RAG_SQLITE_PATH: apps/api/runtime/rag/rag.sqlite3
      APP_LEGACY_JSON_FALLBACK: "false"
      VIDEO_AGENT_BASE_URL: http://host.docker.internal:8001
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/runtime:/app/apps/api/runtime
      - ./apps/api/uploads:/app/apps/api/uploads
    working_dir: /app/apps/api
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
