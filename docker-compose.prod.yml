services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meizhaiseek}
      POSTGRES_USER: ${POSTGRES_USER:-meizhaiseek}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_BIND_ADDR:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meizhaiseek} -d ${POSTGRES_DB:-meizhaiseek}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_BIND_ADDR:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_BUCKET: ${S3_BUCKET:-meizhaiseek-artifacts}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" &&
      mc mb -p local/\"$${S3_BUCKET}\" || true
      "

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      APP_DB_BACKEND: ${APP_DB_BACKEND:-postgres}
      APP_DATABASE_URL: ${APP_DATABASE_URL:?APP_DATABASE_URL is required}
      APP_ENV: ${APP_ENV:-production}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?AUTH_TOKEN_SECRET is required}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      MEIZHAISEEK_ADMIN_INITIAL_PASSWORD: ${MEIZHAISEEK_ADMIN_INITIAL_PASSWORD:-}
      APP_DB_POOL_SIZE: ${APP_DB_POOL_SIZE:-5}
      APP_DB_MAX_OVERFLOW: ${APP_DB_MAX_OVERFLOW:-5}
      APP_SQLITE_PATH: apps/api/runtime/app/meizhaiseek.sqlite3
      RAG_SQLITE_PATH: apps/api/runtime/rag/rag.sqlite3
      RAG_BACKEND: ${RAG_BACKEND:-pgvector}
      APP_LEGACY_JSON_FALLBACK: "false"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CACHE_BACKEND: ${CACHE_BACKEND:-redis}
      EVENT_BACKEND: ${EVENT_BACKEND:-redis}
      MULTI_INSTANCE_SSE_VERIFIED: ${MULTI_INSTANCE_SSE_VERIFIED:-passed}
      TASK_QUEUE_BACKEND: ${TASK_QUEUE_BACKEND:-redis}
      ARTIFACT_STORAGE_BACKEND: ${ARTIFACT_STORAGE_BACKEND:-s3}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-meizhaiseek-artifacts}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_SECURE: ${S3_SECURE:-false}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      VIDEO_AGENT_BASE_URL: http://host.docker.internal:8001
      MULTI_INSTANCE_SSE_VERIFIED: ${MULTI_INSTANCE_SSE_VERIFIED:-not_run}
      REDIS_RECOVERY_VERIFIED: ${REDIS_RECOVERY_VERIFIED:-not_run}
      WORKER_RECOVERY_VERIFIED: ${WORKER_RECOVERY_VERIFIED:-not_run}
      VIDEO_QUEUE_50_VERIFIED: ${VIDEO_QUEUE_50_VERIFIED:-not_run}
      DATASET_QUEUE_VERIFIED: ${DATASET_QUEUE_VERIFIED:-not_run}
      KNOWLEDGE_QUEUE_VERIFIED: ${KNOWLEDGE_QUEUE_VERIFIED:-not_run}
      BLUEPRINT_QUEUE_VERIFIED: ${BLUEPRINT_QUEUE_VERIFIED:-not_run}
      ARTIFACT_S3_VERIFIED: ${ARTIFACT_S3_VERIFIED:-not_run}
      PGVECTOR_MIGRATION_VERIFIED: ${PGVECTOR_MIGRATION_VERIFIED:-not_run}
      BROWSER_AGENT_SMOKE_VERIFIED: ${BROWSER_AGENT_SMOKE_VERIFIED:-not_run}
      CAPACITY_LAST_VERIFIED_USERS: ${CAPACITY_LAST_VERIFIED_USERS:-0}
      CAPACITY_LAST_TEST_PASSED: ${CAPACITY_LAST_TEST_PASSED:-not_run}
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/runtime:/app/apps/api/runtime
      - ./apps/api/uploads:/app/apps/api/uploads
    working_dir: /app/apps/api
    command: sh -c "if [ \"$${APP_DB_BACKEND}\" = \"postgres\" ]; then cd /app && alembic upgrade head; cd /app/apps/api; fi; python -m uvicorn main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  worker-general:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      APP_DB_BACKEND: ${APP_DB_BACKEND:-postgres}
      APP_DATABASE_URL: ${APP_DATABASE_URL:?APP_DATABASE_URL is required}
      APP_ENV: ${APP_ENV:-production}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?AUTH_TOKEN_SECRET is required}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      APP_DB_POOL_SIZE: ${WORKER_GENERAL_DB_POOL_SIZE:-4}
      APP_DB_MAX_OVERFLOW: ${WORKER_GENERAL_DB_MAX_OVERFLOW:-2}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TASK_QUEUE_BACKEND: redis
      RQ_QUEUES: general,dataset,knowledge,blueprint
      EVENT_BACKEND: ${EVENT_BACKEND:-redis}
      RAG_BACKEND: ${RAG_BACKEND:-pgvector}
      ARTIFACT_STORAGE_BACKEND: ${ARTIFACT_STORAGE_BACKEND:-s3}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-meizhaiseek-artifacts}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_SECURE: ${S3_SECURE:-false}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      VIDEO_AGENT_BASE_URL: http://host.docker.internal:8001
      MULTI_INSTANCE_SSE_VERIFIED: ${MULTI_INSTANCE_SSE_VERIFIED:-not_run}
      REDIS_RECOVERY_VERIFIED: ${REDIS_RECOVERY_VERIFIED:-not_run}
      WORKER_RECOVERY_VERIFIED: ${WORKER_RECOVERY_VERIFIED:-not_run}
      VIDEO_QUEUE_50_VERIFIED: ${VIDEO_QUEUE_50_VERIFIED:-not_run}
      DATASET_QUEUE_VERIFIED: ${DATASET_QUEUE_VERIFIED:-not_run}
      KNOWLEDGE_QUEUE_VERIFIED: ${KNOWLEDGE_QUEUE_VERIFIED:-not_run}
      BLUEPRINT_QUEUE_VERIFIED: ${BLUEPRINT_QUEUE_VERIFIED:-not_run}
      ARTIFACT_S3_VERIFIED: ${ARTIFACT_S3_VERIFIED:-not_run}
      PGVECTOR_MIGRATION_VERIFIED: ${PGVECTOR_MIGRATION_VERIFIED:-not_run}
      BROWSER_AGENT_SMOKE_VERIFIED: ${BROWSER_AGENT_SMOKE_VERIFIED:-not_run}
      CAPACITY_LAST_VERIFIED_USERS: ${CAPACITY_LAST_VERIFIED_USERS:-0}
      CAPACITY_LAST_TEST_PASSED: ${CAPACITY_LAST_TEST_PASSED:-not_run}
    working_dir: /app/apps/api
    command: python -m workers.worker
    volumes:
      - ./apps/api/runtime:/app/apps/api/runtime
      - ./apps/api/uploads:/app/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  worker-video:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      APP_DB_BACKEND: ${APP_DB_BACKEND:-postgres}
      APP_DATABASE_URL: ${APP_DATABASE_URL:?APP_DATABASE_URL is required}
      APP_ENV: ${APP_ENV:-production}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?AUTH_TOKEN_SECRET is required}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      APP_DB_POOL_SIZE: ${WORKER_VIDEO_DB_POOL_SIZE:-2}
      APP_DB_MAX_OVERFLOW: ${WORKER_VIDEO_DB_MAX_OVERFLOW:-1}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TASK_QUEUE_BACKEND: redis
      RQ_QUEUES: video
      EVENT_BACKEND: ${EVENT_BACKEND:-redis}
      RAG_BACKEND: ${RAG_BACKEND:-pgvector}
      VIDEO_AGENT_MAX_CONCURRENCY: ${VIDEO_AGENT_MAX_CONCURRENCY:-2}
      ARTIFACT_STORAGE_BACKEND: ${ARTIFACT_STORAGE_BACKEND:-s3}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-meizhaiseek-artifacts}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_SECURE: ${S3_SECURE:-false}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      VIDEO_AGENT_BASE_URL: http://host.docker.internal:8001
      MULTI_INSTANCE_SSE_VERIFIED: ${MULTI_INSTANCE_SSE_VERIFIED:-not_run}
      REDIS_RECOVERY_VERIFIED: ${REDIS_RECOVERY_VERIFIED:-not_run}
      WORKER_RECOVERY_VERIFIED: ${WORKER_RECOVERY_VERIFIED:-not_run}
      VIDEO_QUEUE_50_VERIFIED: ${VIDEO_QUEUE_50_VERIFIED:-not_run}
      DATASET_QUEUE_VERIFIED: ${DATASET_QUEUE_VERIFIED:-not_run}
      KNOWLEDGE_QUEUE_VERIFIED: ${KNOWLEDGE_QUEUE_VERIFIED:-not_run}
      BLUEPRINT_QUEUE_VERIFIED: ${BLUEPRINT_QUEUE_VERIFIED:-not_run}
      ARTIFACT_S3_VERIFIED: ${ARTIFACT_S3_VERIFIED:-not_run}
      PGVECTOR_MIGRATION_VERIFIED: ${PGVECTOR_MIGRATION_VERIFIED:-not_run}
      BROWSER_AGENT_SMOKE_VERIFIED: ${BROWSER_AGENT_SMOKE_VERIFIED:-not_run}
      CAPACITY_LAST_VERIFIED_USERS: ${CAPACITY_LAST_VERIFIED_USERS:-0}
      CAPACITY_LAST_TEST_PASSED: ${CAPACITY_LAST_TEST_PASSED:-not_run}
    working_dir: /app/apps/api
    command: python -m workers.worker
    volumes:
      - ./apps/api/runtime:/app/apps/api/runtime
      - ./apps/api/uploads:/app/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.status < 500 ? 0 : 1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.v18.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
